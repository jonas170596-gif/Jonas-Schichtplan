# Stammdaten der Mitarbeiter.
#
#   soll_stunden                 Brutto-Wochenstunden inkl. Pause
#   soll_tage                    angestrebte Arbeitstage pro Woche
#   max_tage                     Obergrenze Arbeitstage pro Woche
#   stunden_toleranz_h           straffreie Abweichung vom Wochensoll
#                                (leer = Vorgabe aus regeln.yaml)
#   moeglichst_wenig             true = jede Stunde kostet Strafpunkte, der/die MA
#                                wird nur eingesetzt, wenn die Besetzung es braucht
#   zaehlt_stundenbudget         false = zaehlt nicht gegen wochenstunden_gesamt (Azubi)
#   feste_freie_tage             gelten immer, ohne Eintrag in der Wochenvorgabe
#   freie_tage_zusammenhaengend  true = freie Tage sollen aneinandergrenzen
#   erlaubte_schichten           was der/die MA ueberhaupt arbeiten darf
#   stamm_schichten              Gewicht 0..1 - je hoeher, desto lieber vergeben

mitarbeiter:

  # ---------------- Vollzeit, 40 h ----------------
  kurka_j:
    name: "J. Kurka"
    soll_stunden: 40
    soll_tage: 5
    feste_freie_tage: []          # freier Tag variabel, der Planer legt ihn
    erlaubte_schichten: [6-14, 6-13:30, 6-12, 6-11, 11-20]
    stamm_schichten: {6-14: 0.88, 6-13:30: 0.05, 11-20: 0.04}
    notiz: "Frueh-Anker. Kandidat fuer die Teamleitersitzung (Schicht endet 13:30)."

  rohwer_c:
    name: "C. Rohwer"
    soll_stunden: 40
    soll_tage: 5
    feste_freie_tage: [mi]
    erlaubte_schichten: [6-14, 11-20, 6-13:30, 6-12, 9-18, 10-18, 11-18, 8-18]
    stamm_schichten: {6-14: 0.56, 11-20: 0.30}
    notiz: "Kandidat fuer die Teamleitersitzung (Schicht endet 13:30)."

  marino_a:
    name: "A. Marino"
    soll_stunden: 40
    soll_tage: 5
    feste_freie_tage: [mo]
    erlaubte_schichten: [6-14, 11-20, 6-13:30, 6-11, 9-18, 10-18]
    stamm_schichten: {11-20: 0.48, 6-14: 0.41, 9-18: 0.06}

  # ---------------- Teilzeit ----------------
  sannzenbacher_n:
    name: "N. Sannzenbacher"
    soll_stunden: 32               # aus der Historie, Vertragswert noch offen
    soll_tage: 4
    erlaubte_schichten: [6-14, 12-20, 11-20, 14-20, 6-13:30, 10-18, 11-18, 12-18]
    stamm_schichten: {6-14: 0.40, 12-20: 0.38, 10-18: 0.10}

  reich_s:
    name: "S. Reich"
    soll_stunden: 30               # aus der Historie, Vertragswert noch offen
    soll_tage: 4
    feste_freie_tage: [mo, mi]     # Aenderung nur nach Absprache -> dann 'fest' in der Wochenvorgabe
    erlaubte_schichten: [6-14, 11-20, 14-20, 8-16, 9-16, 11-18, 12-18, 10-18]
    stamm_schichten: {6-14: 0.34, 11-20: 0.24, 14-20: 0.17, 11-18: 0.12}

  nachtrieb_i:
    name: "I. Nachtrieb"
    soll_stunden: 24               # Monatsmittel, einzelne Wochen duerfen abweichen
    soll_tage: 3
    max_tage: 5
    stunden_toleranz_h: 8          # bewusst weit - Ausgleich passiert ueber den Monat
    erlaubte_schichten: [14-20, 6-14, 11-20, 12-20, 13-20, 8-16, 9-16, 12-18, 11-18, 9-18]
    stamm_schichten: {14-20: 0.35, 6-14: 0.23, 11-20: 0.10, 12-18: 0.08}

  kohl_b:
    name: "B. Kohl"
    soll_stunden: 30
    soll_tage: 4
    freie_tage_zusammenhaengend: true
    erlaubte_schichten: [12-20, 6-13:30, 6-12, 8-15:30, 10-18, 12-18]
    stamm_schichten: {12-20: 0.44, 6-13:30: 0.40, 10-18: 0.07}

  kurz_c:
    name: "C. Kurz"
    soll_stunden: 17               # aus der Historie, Vertragswert noch offen
    soll_tage: 3
    max_tage: 4
    feste_freie_tage: [di, fr, sa]
    erlaubte_schichten: [8-14, 8-13, 8-11, 6-12, 6-14]
    stamm_schichten: {8-14: 0.64, 8-13: 0.28}

  kurz_u:
    name: "U. Kurz"
    moeglichst_wenig: true         # nur einsetzen, wenn die Besetzung es verlangt
    soll_stunden: 0
    soll_tage: 0
    max_tage: 5
    feste_freie_tage: [di]
    erlaubte_schichten: [14-20, 12-20, 11-20, 8-16, 8-14, 8-11, 6-14, 9-18, 10-18, 12-18, 8-18]
    stamm_schichten: {14-20: 0.56, 12-18: 0.08}
    notiz: "Flexible Reserve. Breit einsetzbar, soll aber so wenig wie moeglich arbeiten."

  # ---------------- Azubi ----------------
  menzler_a:
    name: "A. Menzler"
    soll_stunden: 32
    soll_tage: 4
    zaehlt_stundenbudget: false    # Azubistunden zaehlen nicht gegen die 255 h
    erlaubte_schichten: [8-16, 6-14, 11-20, 12-20, 6-13:30, 9-18, 10-18, 11-18, 12-18]
    stamm_schichten: {8-16: 0.61, 6-14: 0.11, 11-20: 0.11}
    notiz: "Berufsschultage je Woche in der Wochenvorgabe unter 'schule' eintragen."

  kurz_t:
    name: "T. Kurz"
    im_plan: false
    notiz: "In der Historie nie in Winterbach eingeplant."
