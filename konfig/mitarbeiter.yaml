# Stammdaten der Mitarbeiter.
#
#   vorname                      wie er am Wandkalender steht; darueber
#                                ordnet daten/kalender.yaml die Eintraege zu
#   faehigkeiten                 f = Fleisch, w = Wurst, o = Ofen
#   soll_stunden                 Brutto-Wochenstunden inkl. Pause
#   soll_tage                    angestrebte Arbeitstage pro Woche
#   max_tage                     Obergrenze Arbeitstage pro Woche
#   stunden_toleranz_h           straffreie Abweichung vom Wochensoll
#                                (leer = Vorgabe aus regeln.yaml)
#   moeglichst_wenig             true = jede Stunde kostet Strafpunkte, der/die MA
#                                wird nur eingesetzt, wenn die Besetzung es braucht
#   zaehlt_stundenbudget         false = zaehlt nicht gegen wochenstunden_gesamt (Azubi)
#   feste_freie_tage             gelten immer, ohne Eintrag in der Wochenvorgabe
#   bevorzugte_freie_tage        sollen frei bleiben, duerfen aber weichen
#   vermeiden                    Schichtkategorien oder -IDs, die nur im Notfall kommen
#   schichtwunsch                tag -> Kategorie oder Schicht, weicher Wunsch
#   schicht_wochenwechsel        Tagesblock, dessen Tage auf derselben Seite
#                                liegen sollen; mit wechselt: true zusaetzlich
#                                im Takt (eine Woche frueh, die naechste spaet)
#   zaehlt_kopfzahl              false = steht zusaetzlich im Laden; eine Tagesliste
#                                nennt die Tage, an denen der/die MA doch mitzaehlt
#   stundenprioritaet            >1: soll seine Stunden eher erreichen, <1: darf
#                                eher darunter bleiben. Trifft nur das Stundenkonto,
#                                der Samstagsausgleich bleibt unberuehrt
#   zusatzschichten              tag -> Schichten, die nur an dem Tag erlaubt sind
#   kein_spaet_vor_frueh         true = Spaet und am Folgetag Frueh ist ausgeschlossen
#   samstag_moeglich             true = ein freier Samstag ist erlaubt, auch wenn
#                                Solltage und feste freie Tage die Woche ausfuellen
#   frueh_ab_koepfen             Fruehschicht nur ab so vielen Koepfen in der Frueh
#   frueh_spaet_ausgleich        false = nimmt am Frueh/Spaet-Ausgleich nicht teil
#   freie_tage_zusammenhaengend  true = freie Tage sollen aneinandergrenzen
#   erlaubte_schichten           was der/die MA ueberhaupt arbeiten darf
#   stamm_schichten              Gewicht 0..1 - je hoeher, desto lieber vergeben

mitarbeiter:

  # ---------------- Vollzeit, 40 h ----------------
  kurka_j:
    name: "J. Kurka"
    vorname: Jonas
    faehigkeiten: [f, w, o]
    soll_stunden: 40
    soll_tage: 5
    stundenprioritaet: 1.6        # soll seine Stunden am ehesten erreichen
    feste_freie_tage: []          # freier Tag variabel, der Planer legt ihn
    vermeiden: [spaet]            # der Frueh-Anker, Spaet nur im Notfall
    frueh_spaet_ausgleich: false  # nimmt am Ausgleich bewusst nicht teil
    erlaubte_schichten: [6-14, 6-13:30, 11-20]   # 6-13:30 nur zur Auswahl,
    stamm_schichten: {6-14: 0.93, 11-20: 0.04}   # von sich aus nimmt der
                                                 # Planer sie nicht
    notiz: "Hauptsaechlicher Frueh-Anker, montags gesetzt (siehe team.yaml).
      Einziger Kandidat fuer die Teamleitersitzung am Dienstag."

  rohwer_c:
    name: "C. Rohwer"
    vorname: Carmen
    faehigkeiten: [f, w, o]
    soll_stunden: 40
    soll_tage: 5
    feste_freie_tage: [mi]
    schichtwunsch: {mo: frueh, di: frueh, mi: frueh, do: frueh}
    frueh_spaet_ausgleich: false  # Mo-Do frueh ist gesetzt, damit ist er frueh-lastig;
                                  # der Ausgleich passiert bei ihm nur ueber Fr/Sa
    stundenprioritaet: 0.5        # darf eher unter ihren Stunden bleiben
    samstagprioritaet: 0.3        # Der Mittwoch bleibt ihr fester freier Tag.
                                  # Damit sind Mo/Di/Do/Fr/Sa ihre fuenf
                                  # Vertragstage und ein freier Samstag geht nur,
                                  # wenn er im Wandkalender steht oder die
                                  # Besetzung ihn hergibt. Der Rueckstand bleibt
                                  # sichtbar, treibt den Plan aber nicht mehr.
    samstag_moeglich: true        # ein freier Fr oder Sa ist zugelassen, auch
                                  # wenn sie dafuer unter ihre fuenf Tage faellt
    schicht_wochenwechsel:
      - tage: [fr, sa]            # Freitag und Samstag gehoeren zusammen:
                                  # eine Woche beide frueh, die naechste beide
                                  # spaet, dann wieder frueh
    erlaubte_schichten: [6-14, 6-13:30, 11-20, 9-18, 10-18, 11-18]
    stamm_schichten: {6-14: 0.56, 11-20: 0.30}   # 6-13:30 ohne Gewicht:
                                                 # waehlbar, aber keine Gewohnheit
    notiz: "Mo-Do frueh, Fr/Sa im Wechsel frueh/spaet."

  marino_a:
    name: "A. Marino"
    vorname: Anna
    faehigkeiten: [f, w, o]
    soll_stunden: 40
    soll_tage: 5
    feste_freie_tage: [mo]
    stundenprioritaet: 1.6         # soll ihre Stunden am ehesten erreichen
    einsatzprioritaet: 1.6         # soll seine Tage eher bekommen als Rohwer;
                                   # ein zusaetzlicher freier Tag geht lieber
                                   # an Rohwer
    erlaubte_schichten: [6-14, 6-13:30, 11-20, 9-18, 10-18]
    stamm_schichten: {11-20: 0.48, 6-14: 0.46, 9-18: 0.06}

  # ---------------- Teilzeit ----------------
  sannzenbacher_n:
    name: "N. Sannzenbacher"
    vorname: Nadine
    faehigkeiten: [f, w]
    soll_stunden: 30
    soll_tage: 4
    stundenprioritaet: 1.6            # soll ihre Stunden am ehesten erreichen
    bevorzugte_freie_tage: [mi, do]   # duerfen wandern, sollen aber zusammenbleiben
    freie_tage_zusammenhaengend: true
    kein_spaet_vor_frueh: true        # langer Heimweg - Spaet und am naechsten Tag
                                      # Frueh geht bei ihr nicht
    schicht_wochenwechsel:            # Mo/Di zusammen, Fr/Sa zusammen - aber
      - {tage: [mo, di], wechselt: false, geschlossen: true}
      - {tage: [fr, sa], wechselt: false, geschlossen: true}
    erlaubte_schichten: [6-14, 12-20, 10-18, 12-18]
    stamm_schichten: {6-14: 0.45, 12-20: 0.45, 10-18: 0.10}
    notiz: "Arbeitet nur Frueh 6-14 oder Spaet 12-20. Mo/Di dieselbe Schicht,
      Fr/Sa dieselbe Schicht, Mi/Do am liebsten frei."

  reich_s:
    name: "S. Reich"
    vorname: Sibylle
    faehigkeiten: [w]
    soll_stunden: 30
    soll_tage: 4
    feste_freie_tage: [mo, mi]     # Aenderung nur nach Absprache -> dann 'fest' in der Wochenvorgabe
    erlaubte_schichten: [6-14, 11-20, 14-20, 8-16, 9-16, 11-18, 12-18, 10-18]
    stamm_schichten: {6-14: 0.34, 11-20: 0.24, 14-20: 0.17, 11-18: 0.12}

  nachtrieb_i:
    name: "I. Nachtrieb"
    vorname: Ingrid
    faehigkeiten: [f, w]
    soll_stunden: 24               # Monatsmittel, einzelne Wochen duerfen abweichen
    soll_tage: 3
    max_tage: 5
    stunden_toleranz_h: 8          # bewusst weit - Ausgleich passiert ueber den Monat
    spaet_anteil: 0.6              # sie ist eine Spaetschichtkraft: ueber 14 Wochen
                                   # 19 Frueh gegen 29 Spaet. Der 50/50-Ausgleich
                                   # haette sie morgens eingeteilt, wo sie real
                                   # kaum steht.
    erlaubte_schichten: [14-20, 6-14, 11-20, 12-20, 13-20, 8-16, 9-16, 12-18, 11-18, 10-18]
    stamm_schichten: {14-20: 0.35, 6-14: 0.23, 11-20: 0.10, 12-18: 0.08}

  kohl_b:
    name: "B. Kohl"
    vorname: Baerbel
    faehigkeiten: [w]
    soll_stunden: 30
    soll_tage: 4
    freie_tage_zusammenhaengend: true
    erlaubte_schichten: [6-13:30, 8-15:30, 12-20, 10-18]
    stamm_schichten: {6-13:30: 0.42, 12-20: 0.40, 8-15:30: 0.10, 10-18: 0.08}
    notiz: "Vier Tage, rund 7,5 h netto am Tag: Frueh 6-13:30, Mittel 8-15:30,
      Spaet 12-20, samstags 10-18."

  kurz_c:
    name: "C. Kurz"
    vorname: Carina
    faehigkeiten: [f, w, o]
    soll_stunden: 17               # was ihre feste Struktur hergibt: 6 + 5 + 6 h
    soll_tage: 3
    max_tage: 4
    feste_freie_tage: [di, fr, sa]    # Mo/Mi/Do ist ihre Struktur, das sind
                                      # genau ihre drei Vertragstage. Di, Fr und
                                      # Sa nur nach Absprache - dann in der
                                      # Wochenvorgabe unter 'kann_arbeiten'
                                      # (oder direkt unter 'fest') eintragen.
    schichtwunsch: {mo: 8-14, mi: 8-13, do: 8-14}   # ihre feste Struktur
    erlaubte_schichten: [8-14, 8-13, 8-16]   # unter der Woche nie vor 8
    zusatzschichten: {sa: [6-14]}            # samstags geht 6 Uhr
    nur_schichten: {sa: [6-14]}              # und samstags dann auch nur das
    stamm_schichten: {8-14: 0.64, 8-13: 0.28}
    notiz: "Feste Struktur Mo 8-14 / Mi 8-13 / Do 8-14; auf Nachfrage geht
      anderes. Fr oder Sa nur nach Absprache - dann in der Wochenvorgabe
      unter 'fest' eintragen."

  kurz_u:
    name: "U. Kurz"
    vorname: Ursel
    faehigkeiten: [f, w]
    moeglichst_wenig: true         # leichter Gegendruck, damit sie nicht
                                   # ohne Not eingeteilt wird
    nur_obergrenze: true           # soll_stunden/soll_tage sind Obergrenzen -
                                   # weniger ist frei, mehr kostet
    soll_stunden: 22               # entspricht etwa drei Schichten
    soll_tage: 3                   # drei Tage sind ausdruecklich in Ordnung
    max_tage: 4
    frueh_spaet_ausgleich: false   # Reserve bekommt, was uebrig bleibt
    feste_freie_tage: [di]
    erlaubte_schichten: [14-20, 12-20, 11-20, 8-16, 8-14, 6-14, 10-18, 11-18, 12-18]
    stamm_schichten: {14-20: 0.56, 12-18: 0.08}
    notiz: "Flexible Reserve, breit einsetzbar. Bis zu drei Tage pro Woche sind
      unproblematisch, darueber wird es teuer."

  # ---------------- Azubi ----------------
  menzler_a:
    name: "A. Menzler"
    vorname: Alex
    faehigkeiten: [f, w]
    soll_stunden: 40               # Wochensoll inklusive Berufsschule
    soll_tage: 5
    stundenprioritaet: 1.6         # die Ausbildungszeit muss zusammenkommen
    praesenztage: 5                # Schichten + Schultage ergeben immer 5 Tage
    abwesenheit_stunden: {schule: 8}   # ein Schultag deckt 8 h des Wochensolls
    springer: true                 # wechselnde Schichten sind bei ihm gewollt;
                                   # der Spaet-Frueh-Wechsel gilt fuer ihn wie
                                   # fuer alle anderen.
    spaet_anteil: 0.25             # rund ein Viertel seiner Schichten spaet,
                                   # gemessen ueber das rollierende Fenster -
                                   # statt des 50/50-Ausgleichs der anderen
    bevorzugte_kategorie: mittel   # als zweite Mittelschicht obendrauf; da ist
                                   # Zeit zum Lernen und Ueben. Spaetschichten
                                   # uebernimmt lieber jemand anderes.
    # zaehlt_stundenbudget bleibt true: das Auswertungsblatt der Filiale zaehlt
    # seine Stunden mit. Dass er "offiziell nicht zaehlt", betrifft die
    # Kopfzahl im Laden (zaehlt_kopfzahl), nicht die Stundenkennzahl.
    zaehlt_kopfzahl: [fr, sa]      # Mo-Do kommt er als zweite Mittelschicht auf
                                   # das Tagesgeruest obendrauf und belegt keinen
                                   # Platz aus bedarf.kopfzahl. Fr und Sa zaehlt
                                   # er normal mit - so sind die Zielkopfzahlen
                                   # aus den Altplaenen gemittelt.
    frueh_ab_koepfen: 3              # Fruehschicht nur mit mindestens drei Koepfen -
                                     # fachlich traegt er sie zu zweit noch nicht mit
    bevorzugte_freie_tage: [mo, di]  # sein freier Tag soll frueh in der Woche
                                     # liegen, nicht auf Fr oder Sa
    erlaubte_schichten: [8-16, 6-14, 11-20, 9-18, 10-18, 11-18, 12-18]
    # Mo-Fr faengt seine Spaetschicht um 11 an: ein spaeterer Start kuerzt dem
    # Azubi die Stunden zu stark. Samstags darf verkuerzt werden (11-18, 12-18).
    stamm_schichten: {8-16: 0.45, 6-14: 0.25, 11-20: 0.10, 9-18: 0.10, 10-18: 0.10}
    notiz: >-
      Springer. Berufsschultage je Woche in der Wochenvorgabe unter 'schule'
      eintragen. Ohne Schultag arbeitet er fuenf Schichten, mit einem vier -
      dadurch ist er auch bei Vollbesetzung dabei.

  # ---------------- Aushilfen ----------------
  # Beide stehen in jeder Woche in der Tafel, damit sie sich von Hand
  # eintragen lassen. Eingeplant werden sie von sich aus nicht:
  # moeglichst_wenig und nur_obergrenze machen jede ihrer Schichten teuer,
  # der Planer greift also erst danach, wenn die eigene Mannschaft nicht
  # reicht. Ihre Schichten sind damit genau die Liste dessen, was angefragt
  # werden muss.
  kurz_t:
    name: "T. Kurz (Senior)"
    vorname: Thomas
    faehigkeiten: [f]              # nur Fleisch
    soll_stunden: 15
    soll_tage: 3
    max_tage: 3
    moeglichst_wenig: true
    nur_obergrenze: true
    einsatzkosten: 8              # nur, wenn sonst jemand fehlen wuerde
    samstag_konto: false           # kein Konto, er ist keine Vertragskraft
    frueh_spaet_ausgleich: false
    erlaubte_schichten: [6-11]     # er arbeitet nur vormittags
    notiz: "Seniorchef, springt gelegentlich ein."

  palmstrasse:
    name: "Palmstraße Aushilfe"
    faehigkeiten: [f, w, o]
    soll_stunden: 48
    soll_tage: 6
    moeglichst_wenig: true
    nur_obergrenze: true
    einsatzkosten: 8              # nur, wenn sonst jemand fehlen wuerde
    samstag_konto: false
    frueh_spaet_ausgleich: false
    # Keine Fruehschicht und kein spaeter Start: sie kommt aus einer anderen
    # Filiale, kennt sich nicht aus und braucht jemanden, der ihr etwas
    # zeigt. Um 11 ist der Laden besetzt, um 6 waere sie mit zweien allein.
    erlaubte_schichten: [11-20, 8-16, 9-18, 10-18, 11-18]
    # Solange unklar ist, wie erfahren die Person ist: Spaetschicht nur,
    # wenn eine der drei Erfahrenen ebenfalls spaet arbeitet.
    begleitung:
      kategorie: spaet
      gruppe: [rohwer_c, marino_a, sannzenbacher_n]
    notiz: "Aushilfe aus der Palmstrasse, auf Anfrage."
