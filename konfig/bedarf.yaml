# Personalbedarf je Wochentag - aus der Historie abgeleitet.
# kopfzahl / frueh_min / schluss_min sind die harten Eckpfeiler,
# besetzung_min ist die Feinkurve ueber den Tag.

offene_tage: [mo, di, mi, do, fr, sa]

oeffnung:                     # Planungsfenster, nicht Ladenoeffnung
  mo: {von: "06:00", bis: "20:00"}
  di: {von: "06:00", bis: "20:00"}
  mi: {von: "06:00", bis: "20:00"}
  do: {von: "06:00", bis: "20:00"}
  fr: {von: "06:00", bis: "20:00"}
  sa: {von: "06:00", bis: "18:00"}

# Wochenbudget fuer die Umsatzziele je Verkaeuferstunde. Azubistunden zaehlen
# nicht mit (menzler_a: zaehlt_stundenbudget: false). Faellt jemand ganz oder
# teilweise aus, sinkt das Budget automatisch um dessen Sollstunden.
# Von jeder Schicht wird eine halbe Stunde Pause abgezogen (ArbZG 4). Die
# Summen im Plan und das Budget unten sind deshalb Nettostunden - das ist
# die Zeit, die tatsaechlich als Verkaeuferstunde zaehlt.
pause_minuten: 30

wochenstunden_gesamt: 255
wochenstunden_gesamt_toleranz: 5

kopfzahl_toleranz_unter: 0    # unter der Zielkopfzahl wird sofort bestraft
kopfzahl_toleranz_ueber: 0    # ueberbesetzt wird nicht: wenn die Mannschaft
                              # mehr Tage hergibt als der Tag braucht, bekommt
                              # jemand einen zusaetzlichen freien Tag
kopfzahl:                     # Zielanzahl eingeteilter Mitarbeiter
  mo: 5
  di: 5
  mi: 5
  do: 5
  fr: 7
  sa: 7

# Tagesgeruest Montag bis Donnerstag: zwei Frueh, eine Mittel, zwei Spaet -
# zusammen die fuenf Koepfe von oben. Der Azubi kommt als zusaetzliche
# Mittelschicht obendrauf, deshalb wird bei 'mittel' nur ein Fehlbestand
# bemaengelt und kein Ueberhang. An Tagen rund um einen Feiertag gilt das
# Profil nicht, dort zaehlen die Feiertagsregeln.
kategorieprofil:
  mo: {frueh: 2, mittel: 1, spaet: 2}
  di: {frueh: 2, mittel: 1, spaet: 2}
  mi: {frueh: 2, mittel: 1, spaet: 2}
  do: {frueh: 2, mittel: 1, spaet: 2}

frueh_bis: "07:00"            # Schichtstart <= dieser Zeit zaehlt als Frueh
frueh_min:                    # Mindestanzahl Fruehschichten (Produktion/Aufbau)
  mo: 2
  di: 2
  mi: 2
  do: 2
  fr: 3
  sa: 3

schluss_min:                  # Mindestanzahl Schichten bis Ladenschluss
  mo: 2
  di: 2
  mi: 2
  do: 2
  fr: 3
  sa: 3

# Rund um Feiertage verschiebt sich das Geschaeft: davor wird abends
# eingekauft, danach muss morgens mehr aufgebaut werden. Die Werte heben die
# Mindestwerte oben an, sie senken nie. Welcher Tag betroffen ist, rechnet der
# Planer aus dem Feiertagskalender - der Samstag vor einem Feiertagsmontag
# zaehlt mit, weil sonntags ohnehin zu ist.
feiertagsregeln:
  bundesland: BW
  vor_feiertag:
    schluss_min: 4            # vier bis Ladenschluss
    # kopfzahl: 6             # bei Bedarf auch die Zielkopfzahl anheben
  nach_feiertag:
    frueh_min: 3              # drei ab 6 Uhr
    # kopfzahl: 6

besetzung_min:                # Mindestbesetzung je Zeitfenster
  mo:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "12:00", min: 3}
    - {von: "12:00", bis: "13:30", min: 4}
    - {von: "13:30", bis: "20:00", min: 2}
  di:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "12:00", min: 3}
    - {von: "12:00", bis: "13:30", min: 4}
    - {von: "13:30", bis: "20:00", min: 2}
  mi:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "12:00", min: 3}
    - {von: "12:00", bis: "13:00", min: 4}
    - {von: "13:00", bis: "20:00", min: 2}
  do:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "12:00", min: 3}
    - {von: "12:00", bis: "13:30", min: 4}
    - {von: "13:30", bis: "20:00", min: 2}
  fr:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "11:00", min: 3}
    - {von: "11:00", bis: "12:00", min: 4}
    - {von: "12:00", bis: "13:30", min: 5}
    - {von: "13:30", bis: "14:00", min: 4}
    - {von: "14:00", bis: "20:00", min: 3}
  sa:
    - {von: "06:00", bis: "08:00", min: 2}
    - {von: "08:00", bis: "10:00", min: 3}
    - {von: "10:00", bis: "11:00", min: 4}
    - {von: "11:00", bis: "13:30", min: 5}
    - {von: "13:30", bis: "14:00", min: 4}
    - {von: "14:00", bis: "18:00", min: 3}
