# Zielgewichte des Planers. Der Generator minimiert die Summe aller
# Strafpunkte - hohe Gewichte = "eher hart", niedrige = "nice to have".
# Zum Nachjustieren: erst das Gewicht der Regel erhoehen, die verletzt wird,
# und `python -m schichtplan pruefen` auf das Ergebnis laufen lassen.

ruhezeit_h: 11            # Zielruhe zwischen zwei Schichten (ArbZG §5 Abs. 1)
ruhezeit_min_h: 10        # harte Untergrenze (Spaet 11-20 -> Frueh 6-14 sind genau 10 h;
                          # kommt in den Altplaenen regelmaessig vor)
stunden_toleranz_h: 3     # Abweichung vom Wochensoll, die straffrei bleibt
max_tage_in_folge: 6
wechsel_max_pro_woche: 1  # kurze Wechsel (Spaetschicht bis 20 Uhr -> Frueh ab 6 Uhr)
                          # je Mitarbeiter und Woche; jeder weitere wird teuer
ausgleich_fenster_wochen: 4  # rollierendes Fenster fuer den Frueh/Spaet-Ausgleich
ausgleich_toleranz: 2     # so viele Schichten Ungleichgewicht bleiben straffrei

# Freie Samstage sind begehrt und in den Altplaenen sehr ungleich verteilt
# (Rohwer 0 von 12, C. Kurz 10 von 11). Das Konto vergleicht jeden mit dem
# Schnitt aller Teilnehmer: wer zurueckliegt, bekommt Vorrang. Wer Samstag
# ohnehin fest oder bevorzugt frei hat, zaehlt nicht mit, sonst verzerrt er
# den Schnitt.
samstag_fenster_wochen: 0 # 0 = ganze Historie; sonst die letzten X Wochen
samstag_toleranz: 1       # so viele Samstage Rueckstand bleiben straffrei

# Fehltage: wer unter seinem Soll bleibt, sammelt das auf. Ueber das
# Ausgleichsfenster soll es sich verteilen, statt immer denselben zu treffen.
fehltage_toleranz: 1
minusstunden_toleranz_h: 4   # dasselbe in Stunden: so weit darf man hinter dem
                             # Teamschnitt liegen, ohne dass es Punkte kostet

# Harte Obergrenze je Mitarbeiter und Woche. Ohne sie schiebt der Planer in
# Wochen mit mehreren Abwesenden die Luecke auf die Verbliebenen - in KW44
# landete eine 30-Stunden-Kraft bei 48 h an sechs Tagen. 48 h ist die
# Grenze aus ArbZG 3 (sechs Werktage mal acht Stunden).
max_wochenstunden: 48

gewichte:
  # --- Besetzung (das Wichtigste) ---
  kopfzahl: 400             # je fehlendem Kopf gegenueber bedarf.kopfzahl
  # Ueberbesetzung muss teurer sein als ein zusaetzlicher freier Tag
  # (arbeitstage_unter + wochenstunden_unter + Konten), sonst stellt der Planer
  # in gut besetzten Wochen lieber einen ueberzaehligen Kopf in den Laden, als
  # jemanden zu Hause zu lassen.
  kopfzahl_ueber: 900       # je Kopf ueber der Zielkopfzahl
  besetzung_unter: 250      # je fehlender Person und Halbstunde
  besetzung_ueber: 10       # je ueberzaehliger Person und Halbstunde
  # Frueh- und Schlussbesetzung sind ausdrueckliche Mindestvorgaben und muessen
  # die aus der Historie gemittelte Zielkopfzahl schlagen - sonst spart der
  # Planer lieber einen Kopf, als die Vorgabe zu erfuellen.
  frueh_besetzung: 1200     # je fehlender Fruehschicht
  schluss_besetzung: 1200   # je fehlender Schlussschicht
  frueh_ueber: 80           # je Fruehschicht ueber dem Bedarf - wer um 6 Uhr
                            # nicht gebraucht wird, fehlt mittags
  kategorieprofil: 500      # je Schicht Abweichung vom Tagesgeruest Mo-Do
  # Ueber Budget verschlechtert den Umsatz je Verkaeuferstunde und wiegt
  # deshalb am schwersten. Unter Budget wiegt seit der harten Kopfzahl-
  # Obergrenze aber auch schwer: die Kopfzahl deckelt die Anzahl der Leute,
  # also ist das Budget der einzige Zug zu laengeren Schichten. 34 Personen-
  # tage mal 8 h brutto sind genau die 255 h netto.
  gesamtstunden_ueber: 90   # je Stunde ueber dem Wochenbudget (ohne Azubi)
  gesamtstunden_unter: 60   # je Stunde darunter, aber nur wenn die Mannschaft
                            # sie haette leisten koennen - sonst nur ein Hinweis

  # --- Team und Faehigkeiten ---
  faehigkeit: 2500          # Fleisch/Wurst/Ofen nicht besetzt (praktisch hart)
  gruppenbesetzung: 2500    # z. B. kein Frueh-Anker anwesend (praktisch hart)
  unvertraeglich: 2500      # Paare, die nicht zusammenarbeiten duerfen
  termin: 1500              # Teamleitersitzung o. Ae. nicht abgedeckt
  termin_wechsel: 400       # dieselbe Person wie beim letzten Mal

  # --- Arbeitszeit der Mitarbeiter ---
  # Fest sind die Arbeitstage - die hat jeder mit dem Chef vereinbart. Die
  # Vertragsstunden sind dagegen nur Orientierung dafuer, ob jemand im Plus
  # oder Minus steht: Kohl arbeitet vier Tage zu 7,5 h, Reich und Nachtrieb
  # duerfen in der Stundenzahl schwanken. Deshalb wiegen die Tage schwer und
  # die Stunden leicht.
  #
  # Ueber dem Soll bleibt teurer als darunter: Ueberstunden muss jemand
  # wirklich leisten, Minusstunden entstehen aus der Besetzung der Woche.
  # Wen sie treffen, regeln die beiden Konten weiter unten.
  wochenstunden: 14         # je Stunde ueber dem Soll
  wochenstunden_unter: 4    # je Stunde darunter
  arbeitstage: 120          # je Tag ueber dem Soll
  arbeitstage_unter: 90     # je Tag darunter
  max_tage: 5000            # Ueberschreitung von max_tage (praktisch hart)
  max_stunden: 800          # je Stunde ueber max_wochenstunden
  praesenztage: 900         # Schichten + Schultage weichen von der Vorgabe ab
  tage_in_folge: 300        # je Tag ueber max_tage_in_folge

  # --- Wuensche ---
  wunsch_frei: 200          # nicht erfuellter Wunschfreitag
  wunsch_schicht: 120       # nicht erfuellte Wunschschicht oder -kategorie
  soll_arbeiten: 2000       # ausdruecklich zugesagter Arbeitstag nicht belegt

  # --- Qualitaet / Gewohnheit ---
  wechsel: 150              # erster kurzer Wechsel Spaet -> Frueh in der Woche
  wechsel_ueber_limit: 1200 # jeder weitere kurze Wechsel
  ruhezeit_verletzung: 3000 # Ruhe unter ruhezeit_min_h (praktisch hart)
  sparsam_einsetzen: 8      # je Stunde bei MA mit moeglichst_wenig, ohne Meldung.
                            # Nur der leichte Gegendruck, damit die Reserve nicht
                            # ohne Not eingeteilt wird.
  reserve_ueber_bedarf: 400 # je Reservetag mehr, als die Luecke zwischen Plaetzen
                            # und Vertragstagen hergibt. Muss den Tag schlagen,
                            # den sonst jemand mit Vertrag verliert (arbeitstage_
                            # unter 90 plus Konto).
  vermiedene_schicht: 700   # Schicht, die der MA nur im Notfall macht (Kurka spaet)
  frueh_spaet_ausgleich: 200  # je Schicht Ungleichgewicht ueber das Fenster hinaus
  spaet_anteil: 250         # Abweichung vom Zielanteil Spaetschichten (Azubi)
  schichtwunsch: 130        # Wochentag hat nicht die gewuenschte Kategorie
  bevorzugte_kategorie: 120 # je Schicht ausserhalb der Lieblingskategorie
  wochenwechsel_uneinheitlich: 300  # die Tage des Blocks liegen auf verschiedenen Seiten
  wochenwechsel_unvollstaendig: 260 # geschlossener Block nur halb belegt
  wochenwechsel: 220        # zweite Woche in Folge dieselbe Seite
  bevorzugter_freier_tag: 160  # weicher freier Tag musste weichen
  freie_tage_zusammenhaengend: 150  # je zusaetzlichem Block freier Tage
  stammschicht: 110        # Abweichung von den gewohnten Schichten des MA
  samstag_konto: 180        # je Samstag Rueckstand gegenueber dem Schnitt
  # Die beiden Konten verteilen die Minusstunden gerecht: gemessen wird nicht
  # gegen das eigene Soll, sondern gegen den Schnitt der Mannschaft ueber das
  # rollierende Fenster. Wer schon mehr Rueckstand hat als die anderen, ist
  # teuer - also trifft der naechste freie Tag jemand anderen.
  fehltage_konto: 260       # je Tag Rueckstand ueber dem Schnitt, mal Einsatzprioritaet
  minusstunden_konto: 110   # je Stunde Rueckstand ueber dem Schnitt, mal Einsatzprioritaet
  zu_viel_spaet: 350        # mehr Spaetschichten als vorgesehen (Azubi)
  zersplitterung: 20        # viele verschiedene Schichtarten in einer Woche
