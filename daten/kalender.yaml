# Urlaubs- und Wunschkalender, abgelesen vom Wandkalender Okt-Dez 2026.
#
# Die Eintraege nennen den Vornamen, genau wie der Wandkalender. Aufgeloest
# wird ueber das Feld 'vorname' in konfig/mitarbeiter.yaml - so steht die
# Zuordnung an genau einer Stelle und kann hier nicht verrutschen. Ein
# Vorname, den es dort nicht gibt, laesst den Kalender gar nicht erst laden.
#
# art:
#   urlaub          - harte Abwesenheit
#   frei            - fest zugesagter freier Tag. Was hier steht, ist mit der
#                     Person besprochen und sie plant damit - der Tag wird nie
#                     ueberplant und senkt ihr Wochensoll entsprechend.
#   wunsch_frei     - weicher freier Tag; der Planer versucht es, kann aber
#                     davon abweichen. Kommt im Wandkalender bisher nicht vor.
#   wunsch_frueh    - "Vorname frueh" am Kalender, das heisst konkret die
#                     Schicht 6-14. Weicher Wunsch.
#   frei_oder_frueh - "frueh/frei" bzw. "morgens oder frei": bevorzugt frei,
#                     und wenn die Besetzung es doch verlangt, dann nur die
#                     Fruehschicht 6-14 und nichts anderes.
#   krank           - harte Abwesenheit wie Urlaub. Bei offenem Ende ein
#                     Platzhalterdatum setzen und nach der Gesundmeldung kuerzen.
#   arbeitet        - hebt einen festen freien Tag auf (Carina dienstags)
#
# Gestrichene Eintraege stehen unter 'storniert' und wirken nicht mehr.
# Alles, was auf dem Foto nicht eindeutig war, steht unter 'zu_klaeren' und
# wird bewusst NICHT angewendet - lieber nachfragen als raten.

