# Wochenvorgabe 2026-KW44 - alles, was sich von Woche zu Woche aendert.
# Tageskuerzel: mo di mi do fr sa   (weglassen/'alle' = ganze Woche)

woche: 2026-KW44
datum_von: 2026-10-26          # Montag
datum_bis: 2026-10-31          # Samstag
filiale: Winterbach

# Tage, an denen der Laden zu ist. Aus dem BW-Feiertagskalender vorbelegt.
geschlossen: []

# --- Abwesenheiten (hart) ---
urlaub: 
  kurka_j: alle
  menzler_a: alle
  kohl_b: alle
#  reich_s: alle
#  kohl_b: [do, fr, sa]

schule: {}

krank: {}
sonstige: {}

# --- Harte Vorgaben: genau diese Schicht / genau frei ---
fest: 
  # Samstag nach Ansage: Rohwer frueh, damit jemand von Anfang an da ist,
  # Marino hat ihren Wunschtag frei, und Sannzenbacher macht spaet und
  # unterstuetzt damit die Aushilfe.
  rohwer_c: {sa: 6-14}
  marino_a: {mo: 6-14, sa: frei}   # Montag ausnahmsweise, nach Ansage
  sannzenbacher_n: {sa: 12-18}
#  kurka_j: {sa: 6-14}
#  marino_a: {mo: frei}

# --- Wuensche (weich, der Planer versucht sie zu erfuellen) ---
wunsch_frei: 
  marino_a: [sa]

wunsch_schicht: {}
#  kohl_b: {fr: 6-13:30}

# Wunsch nach einer Schichtart statt einer bestimmten Schicht
wunsch_kategorie: {}
#  menzler_a: {sa: frueh}

# Hebt einen festen freien Tag auf - der/die MA arbeitet an dem Tag
arbeitet:
  # Ausnahme nach Ansage: ihr fester freier Montag faellt diese Woche weg,
  # dafuer arbeitet sie Mo-Fr durch und hat den Samstag frei. Das spart
  # Schichten bei der Palmstrasse.
  marino_a: [mo, di, mi, do, fr]
#  kurz_c: [di]

# Nur diese Schichten kommen an dem Tag in Frage (oder frei).
# Zusammen mit wunsch_frei bildet das "frueh oder frei" ab.
# Leihkraft aus einer anderen Filiale - gilt nur fuer diese Woche.
#   faehigkeiten: f = Fleisch, w = Wurst, o = Ofen
#   tage:         an welchen Tagen sie kann (weglassen = ganze Woche)
aushilfe:
  # Offen angesetzt: der Planer nimmt nur so viel davon, wie die eigene
  # Mannschaft nicht hergibt. Ihre Schichten sind damit die Liste dessen,
  # was in der anderen Filiale angefragt werden muss.
  - id: palmstrasse
    name: "Palmstraße Aushilfe"
    faehigkeiten: [f, w, o]
    soll_stunden: 48
    soll_tage: 6
    # Keine Fruehschicht und kein spaeter Start: sie kommt aus einer anderen
    # Filiale, kennt sich nicht aus und braucht jemanden, der ihr etwas zeigt.
    # Um 11 ist der Laden besetzt, um 6 waere sie mit zweien allein.
    erlaubte_schichten: [11-20, 8-16, 9-18, 10-18, 11-18]
    # Solange unklar ist, wie erfahren die Person ist: Spaetschicht nur,
    # wenn eine der drei Erfahrenen ebenfalls spaet arbeitet.
    begleitung:
      kategorie: spaet
      gruppe: [rohwer_c, marino_a, sannzenbacher_n]

  # Seniorchef, springt gelegentlich ein: nur 6-11 und nur Fleisch.
  - id: kurz_t
    name: "T. Kurz (Senior)"
    faehigkeiten: [f]
    soll_stunden: 15
    soll_tage: 3
    max_tage: 3
    erlaubte_schichten: [6-11]

nur_schichten: 
  marino_a: {sa: [6-14]}
#  kurz_u: {sa: [6-14]}

# --- Termine: Schicht muss zu dieser Zeit enden ---
termine: []
#  - name: Teamleitersitzung
#    tag: di
#    ab: "13:30"
#    kandidaten: [kurka_j]
#    anzahl: 1
#    abwechselnd: false     # true: nicht dieselbe Person wie beim letzten Mal
#                           # (nur sinnvoll bei mehreren Kandidaten)

# --- Zusatzaufgaben, die im Plan vermerkt werden ---
zusatz: {}
#  rohwer_c: {sa: [grossputz]}

# --- Abweichendes Wochensoll (z. B. Stundenabbau) ---
soll_stunden: {}
#  kurz_u: 12

# --- Sonderwochen ---
# modus: manuell   -> der Planer rechnet nichts, er prueft nur, was unter
#                     'fest' steht, und exportiert es. Fuer Weihnachten und
#                     aehnliche Wochen. 'neu --manuell' schreibt das Raster gleich mit.
# regeln_aus:      -> Regeln, die in dieser Woche nicht gelten sollen,
#                     z. B. [gesamtstunden, kopfzahl, wochenstunden]
modus: auto
regeln_aus: []

# Bedarf dieser Woche abweichend vom Normalfall (konfig/bedarf.yaml).
# Alles optional, nur was hier steht wird ueberschrieben.
bedarf: {}
#  oeffnung:
#    mi: {von: "05:00", bis: "14:00"}    # Heiligabend
#  kopfzahl: {mi: 10}
#  frueh_min: {mi: 6}
#  schluss_min: {mi: 3}
#  wochenstunden_gesamt: 300

notiz: ""
