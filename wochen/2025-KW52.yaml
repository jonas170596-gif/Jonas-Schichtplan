# Feiertage diese Woche: Donnerstag 1. Weihnachtsfeiertag, Freitag 2. Weihnachtsfeiertag
#
# ACHTUNG Sonderwoche: Heiligabend, 1. Weihnachtsfeiertag, 2. Weihnachtsfeiertag
# Die ueblichen Regeln passen hier nicht (Kopfzahl, Oeffnungszeiten,
# Stundenbudget). Diese Woche von Hand planen oder die Vorgaben unter
# 'fest' komplett durchschreiben.
# Wochenvorgabe 2025-KW52 - alles, was sich von Woche zu Woche aendert.
# Tageskuerzel: mo di mi do fr sa   (weglassen/'alle' = ganze Woche)

woche: 2025-KW52
datum_von: 2025-12-22          # Montag
datum_bis: 2025-12-27          # Samstag
filiale: Winterbach

# Tage, an denen der Laden zu ist. Aus dem BW-Feiertagskalender vorbelegt.
geschlossen: [do, fr]

# --- Abwesenheiten (hart) ---
urlaub: {}
#  reich_s: alle
#  kohl_b: [do, fr, sa]

schule: {}               # Berufsschule Azubi
#  menzler_a: [mi, do]

krank: {}
sonstige: {}

# --- Harte Vorgaben: genau diese Schicht / genau frei ---

# Handplan: jede Zelle steht hier. Eintragen als Schichtzeit ("6-13:30",
# beliebige Zeiten erlaubt, nicht nur Katalogschichten), als "frei", oder
# die Zeile ganz weglassen - dann ist der Tag frei.
fest:
  kurka_j:            # J. Kurka
    mo: 6-14
    di: 6-14
    mi: 5-14
    sa: 6-14
  rohwer_c:           # C. Rohwer
    mo: 6-14
    di: 6-14
    mi: 5-14
    sa: 6-14
  marino_a:           # A. Marino
    mo: 11-20
    di: 11-20
    mi: 6-14
    sa: 9-18
  sannzenbacher_n:    # N. Sannzenbacher
    mo: 12-20
    di: 6-14
    mi: 6-14
    sa: 6-14
  reich_s:            # S. Reich
    mo: frei
    di: 11-20
    mi: 7-14
    sa: 10-18
  nachtrieb_i:        # I. Nachtrieb
    mo: 14-20
    di: 14-20
    mi: 7-14
    sa: 11-18
  kohl_b:             # B. Kohl
    mo: 12-20
    di: 12-20
    mi: 6-14
    sa: frei
  kurz_c:             # C. Kurz
    mo: 8-14
    di: 8-14
    mi: 8-14
    sa: frei
  kurz_u:             # U. Kurz
    mo: frei
    di: 14-20
    mi: 8-14
    sa: 12-18
  menzler_a:          # A. Menzler
    mo: 8-16
    di: 8-16
    mi: 6-14
    sa: 8-16
